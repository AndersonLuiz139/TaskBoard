<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBoard</title>
  <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <a class="pular-link" href="#lista-tarefas">Pular para a lista de tarefas</a>

  <main class="app">
    <section class="todo-card">
      <header class="header">
        <div>
          <p class="tag">Organização pessoal</p>
          <h1>TaskBoard</h1>
          <p class="subtitle">Gerencie suas tarefas com mais praticidade.</p>
        </div>
      </header>

      <section class="nova-tarefa">
        <label class="rotulo-oculto" for="entrada-tarefa">Nova tarefa</label>
        <input
          id="entrada-tarefa"
          type="text"
          class="input-tarefa"
          placeholder="Digite sua tarefa..."
        />
        <button type="button" class="btn-tarefa">Adicionar</button>
      </section>

      <section class="topbar" aria-label="Resumo e filtros">
        <div class="info">
          <span aria-live="polite">Total: <strong id="total">0</strong></span>
        </div>

        <div class="filtros" role="group" aria-label="Filtrar tarefas">
          <button type="button" class="filtro ativo" data-filtro="todas" aria-pressed="true">
            Todas
          </button>
          <button type="button" class="filtro" data-filtro="pendentes" aria-pressed="false">
            Pendentes
          </button>
          <button type="button" class="filtro" data-filtro="concluidas" aria-pressed="false">
            Concluídas
          </button>
        </div>
      </section>

      <ul class="tarefas" id="lista-tarefas"></ul>

      <p class="mensagem-vazia" role="status">Você ainda não adicionou nenhuma tarefa.</p>

      <div class="rodape-acoes">
        <button type="button" class="btn-limpar">Limpar concluídas</button>
      </div>
    </section>
  </main>

  <div class="toasts" role="region" aria-label="Notificações" aria-live="polite"></div>

  <div class="modal-overlay hidden" data-modal="editar">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-editar"
      tabindex="-1"
    >
      <h2 id="titulo-editar">Editar tarefa</h2>
      <p class="modal-texto">Altere o texto da sua tarefa.</p>

      <input
        type="text"
        class="input-editar"
        placeholder="Edite sua tarefa"
      />

      <div class="modal-acoes">
        <button type="button" class="btn-cancelar" data-fechar-modal>Cancelar</button>
        <button type="button" class="btn-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" data-modal="confirmar">
    <div
      class="modal modal-confirmacao"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-confirmar"
      aria-describedby="texto-confirmar"
      tabindex="-1"
    >
      <h2 id="titulo-confirmar">Apagar tarefa</h2>
      <p class="modal-texto" id="texto-confirmar"></p>

      <div class="modal-acoes">
        <button type="button" class="btn-cancelar-modal" data-fechar-modal>Cancelar</button>
        <button type="button" class="btn-confirmar">Apagar</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
